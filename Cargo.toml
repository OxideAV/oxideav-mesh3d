[package]
name = "oxideav-mesh3d"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust 3D scene + mesh typed model — Decoder/Encoder traits for STL/OBJ/glTF/FBX/USD format crates"
repository = "https://github.com/OxideAV/oxideav-mesh3d"
homepage = "https://github.com/OxideAV/oxideav-mesh3d"
readme = "README.md"
keywords = ["3d", "mesh", "scene", "gltf", "pbr"]
categories = ["multimedia", "rendering::data-formats"]

[features]
default = ["registry"]

# `registry` wires up the `Mesh3DRegistry` and the `oxideav-core` Error
# alias so this crate plugs into the broader oxideav framework. Drop it
# (`default-features = false`) for a free-standing build that only
# exposes the typed model + standalone Decoder/Encoder traits with a
# crate-local Error type.
registry = ["dep:oxideav-core"]

[dependencies]
# Optional under the `registry` feature so consumers can use the type
# model without pulling the framework dependency tree.
oxideav-core = { version = "0.1", optional = true }
# `extras: HashMap<String, serde_json::Value>` round-trips loss-tolerant
# side-channel data from non-glTF formats (FBX/USD/OBJ extensions).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Format codec siblings used by the cross-format roundtrip suite +
# `Mesh3DRegistry` lookup tests. They all implement
# `Mesh3DDecoder` / `Mesh3DEncoder` against the typed model in this
# crate and expose a `register(&mut Mesh3DRegistry)` helper under their
# default `registry` feature (which we keep on so the registry tests
# can exercise the `register()` entry points end-to-end).
#
# Versioned at the minor track ("0.0") so patch bumps from release-plz
# don't ripple through. Cargo resolves the cycle by using the local
# path for `oxideav-mesh3d` (this crate) while pulling the format
# crates from crates.io.
oxideav-stl = "0.0"
oxideav-obj = "0.0"
oxideav-gltf = "0.0"
oxideav-usdz = "0.0"

# The format crates dev-depped above all carry their own
# `oxideav-mesh3d = "0.0"` runtime dep. Without `[patch]` Cargo would
# resolve _their_ copy from crates.io and _our_ copy from this local
# path as two distinct compilation units (even at the same version
# string), giving us two `Scene3D` types the trait surface can't
# shuttle between. The patch unifies every consumer of `oxideav-mesh3d`
# in the test build onto the local path so a single `Scene3D` flows
# through the cross-format roundtrip suite.
[patch.crates-io]
oxideav-mesh3d = { path = "." }
